[project]
name = "git-activity"
version = "0.1.0"
description = "A TUI file browser showing git activity metrics"
requires-python = ">=3.8"
dependencies = [
    "textual>=0.47.0",
    "gitpython>=3.1.40",
    "rich>=13.7.0",
]

[project.scripts]
git-activity = "git_activity.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
